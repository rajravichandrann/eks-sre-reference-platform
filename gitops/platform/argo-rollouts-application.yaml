apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/rajravichandrann/eks-sre-reference-platform.git
    targetRevision: gitops
    path: gitops/platform/argo-rollouts

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts

  syncPolicy:
    automated:
      prune: true
      selfHeal: true