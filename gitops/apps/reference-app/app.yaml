apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: eks-sre-reference-app
  labels:
    app: eks-sre-reference-app

spec:
  replicas: 2

  minReadySeconds: 5
  progressDeadlineSeconds: 120

  strategy:
    blueGreen:
      activeService: eks-sre-reference-app
      previewService: eks-sre-reference-app-preview
      autoPromotionEnabled: false
      previewReplicaCount: 1
      scaleDownDelaySeconds: 30

  selector:
    matchLabels:
      app: eks-sre-reference-app

  template:
    metadata:
      labels:
        app: eks-sre-reference-app

      annotations:
        ad.datadoghq.com/app.checks: |
          {
            "openmetrics": {
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:%%port%%/metrics",
                  "namespace": "eks_sre_reference",
                  "metrics": [
                    "http_requests",
                    "http_request_duration_seconds"
                  ],
                  "histogram_buckets_as_distributions": true,
                  "collect_counters_with_distributions": true
                }
              ]
            }
          }

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: 865952398288.dkr.ecr.us-east-1.amazonaws.com/eks-sre-reference-app:sha-693119f219379680e275d0b6b25e70cf48ac3f52
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: APP_VERSION
              value: "bluegreen-v2"

            - name: PYTHONDONTWRITEBYTECODE
              value: "1"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: eks-sre-reference-app

spec:
  selector:
    app: eks-sre-reference-app

  ports:
    - name: http
      port: 80
      targetPort: http

  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: eks-sre-reference-app-preview

spec:
  selector:
    app: eks-sre-reference-app

  ports:
    - name: http
      port: 80
      targetPort: http

  type: ClusterIP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eks-sre-reference-app

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: eks-sre-reference-app