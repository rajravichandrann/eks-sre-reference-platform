apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reference-app
  namespace: argocd

spec:
  project: default
  

  source:
    repoURL: https://github.com/rajravichandrann/eks-sre-reference-platform.git
    targetRevision: gitops
    path: gitops/apps/reference-app

  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: false
      selfHeal: true