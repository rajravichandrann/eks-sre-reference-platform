apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-sre-reference-app
  labels:
    app: eks-sre-reference-app

spec:
  replicas: 2

  minReadySeconds: 5
  progressDeadlineSeconds: 120

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: eks-sre-reference-app

  template:
    metadata:
      labels:
        app: eks-sre-reference-app

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: app
          image: 865952398288.dkr.ecr.us-east-1.amazonaws.com/eks-sre-reference-app:sha-f1a67d73550084ebc4872b07ff1376fb5de4bfe5
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: APP_VERSION
              value: "sha-f1a67d73550084ebc4872b07ff1376fb5de4bfe5"

            - name: PYTHONDONTWRITEBYTECODE
              value: "1"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: eks-sre-reference-app

spec:
  selector:
    app: eks-sre-reference-app

  ports:
    - name: http
      port: 80
      targetPort: http

  type: ClusterIP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eks-sre-reference-app

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: eks-sre-reference-app