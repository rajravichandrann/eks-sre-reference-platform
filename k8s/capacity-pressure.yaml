apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-pressure
  labels:
    app: capacity-pressure
spec:
  replicas: 4
  selector:
    matchLabels:
      app: capacity-pressure
  template:
    metadata:
      labels:
        app: capacity-pressure
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "900m"
              memory: "64Mi"
            limits:
              cpu: "900m"
              memory: "64Mi"
